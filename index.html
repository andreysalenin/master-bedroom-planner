<style id="lock-style">
:root { --bg: #edebe6; --panel: #f8f7f3; --ink: #1d1f21; --muted: #5d6166; --line: #d3cfc6; --accent: #a8620a; --accent-soft: #f3e3c8; --on-accent: #fff; --bad: #b0281f; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #151617; --panel: #1c1d1f; --ink: #e8e6e1; --muted: #a09d97; --line: #33322f; --accent: #eea83d; --accent-soft: #3a2c15; --on-accent: #1a1206; --bad: #ff8a7e; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #151617; --panel: #1c1d1f; --ink: #e8e6e1; --muted: #a09d97; --line: #33322f; --accent: #eea83d; --accent-soft: #3a2c15; --on-accent: #1a1206; --bad: #ff8a7e; color-scheme: dark; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; }
#lock { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
#lock form { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 22px 22px 18px; display: grid; gap: 12px; box-sizing: border-box; }
#lock h1 { margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 30px; line-height: 1; }
#lock .sub { margin: 0; color: var(--muted); font-size: 14px; }
#lock label { font-size: 14px; }
#lock .pw { display: flex; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
#lock .pw:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
#lock input[type=password], #lock input[type=text] { flex: 1; min-width: 0; border: 0; background: transparent; color: inherit; padding: 9px 10px; font: 15px 'IBM Plex Mono', ui-monospace, Menlo, monospace; outline: none; }
#lock .pw button { border: 0; background: transparent; color: var(--muted); padding: 0 10px; cursor: pointer; font: inherit; font-size: 13px; }
#lock .check { display: flex; align-items: center; gap: 8px; color: var(--muted); }
#lock .check input { width: 17px; height: 17px; accent-color: var(--accent); }
#lock .go { border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); border-radius: 6px; padding: 9px 12px; font: inherit; font-weight: 600; cursor: pointer; }
#lock .go:disabled { opacity: .6; cursor: progress; }
#lock .msg { min-height: 1.3em; margin: 0; font-size: 13px; color: var(--muted); }
#lock .msg.bad { color: var(--bad); }
</style>
</head>
<body>
<div id="lock">
  <form autocomplete="on">
    <h1>Master Bedroom</h1>
    <p class="sub">This planner is locked. Enter the passphrase to open it.</p>
    <input type="text" name="username" value="master-bedroom-planner" autocomplete="username" hidden>
    <label for="pp">Passphrase</label>
    <div class="pw"><input id="pp" type="password" autocomplete="current-password" autofocus required><button type="button" id="show" aria-label="Show passphrase">Show</button></div>
    <label class="check"><input type="checkbox" id="rem"> Remember on this device</label>
    <button class="go" type="submit">Unlock</button>
    <p class="msg" id="msg" role="status"></p>
  </form>
</div>
